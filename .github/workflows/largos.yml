name: YouTube LARGOS - Bot Herbolaria

on:
  schedule:
    # Horarios distribuidos cada 4h durante ventana activa (4AM-12AM CDMX)
    # CDMX = UTC-6 (sin horario de verano)
    - cron: '0 10,14,18,22 * * *'    # 4:00, 8:00, 12:00, 16:00 CDMX
    - cron: '0 2 * * *'              # 20:00 (8 PM) CDMX - horario estelar
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Forzar publicación fuera de ventana (1 = sí, solo pruebas)'
        default: '0'

permissions:
  contents: write

jobs:
  publicar-largo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORZAR_PUBLICACION: ${{ github.event.inputs.forzar || '0' }}
      
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot de videos largos
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: python bot_youtube_largos_herbolaria.py

      - name: Commit y push del estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar estado largos [skip ci]"
          file_pattern: "estado_largos_herbolaria.json ingredientes_largos_usados.json titulos_largos_publicados.json"
