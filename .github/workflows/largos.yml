name: YouTube LARGOS - Bot Herbolaria

on:
  schedule:
    # Revisa cada 12 horas; el bot decide si publicar según intervalo (20-26h entre videos)
    - cron: '0 */12 * * *'
  workflow_dispatch:          # Ejecución manual para pruebas

permissions:
  contents: write

jobs:
  publicar-largo:
    runs-on: ubuntu-latest
    timeout-minutes: 45       # ⚠️ Videos largos tardan 5-15 min en renderizar

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot de videos largos
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
        run: python bot_youtube_largos_herbolaria.py

      - name: Commit y push del estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar estado largos [skip ci]"
          # ✅ SOLO los archivos PROPIOS del bot de largos
          file_pattern: "estado_largos_herbolaria.json ingredientes_largos_usados.json titulos_largos_publicados.json"
