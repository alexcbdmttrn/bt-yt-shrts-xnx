name: YouTube Shorts - Bot Xanax

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot de shorts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
        run: python bot_youtube_shorts.py

      - name: Commit y push del estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar estado de shorts [skip ci]"
          file_pattern: "estado_shorts.json titulos_shorts_publicados.json"
