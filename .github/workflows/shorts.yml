name: YouTube Shorts - Bot Herbolaria

on:
  schedule:
    - cron: '0 */4 * * *'  # Cada 4 horas (6 veces al día). El bot decide si publicar.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
        run: python bot_herbolaria_shorts.py

      - name: Commit estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar estado [skip ci]"
          file_pattern: "estado_herbolaria.json ingredientes_usados.json titulos_publicados.json"
