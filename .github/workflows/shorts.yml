name: YouTube Shorts - Bot Herbolaria

on:
  schedule:
    # 15,17,19,21 UTC = 9:00, 11:00, 13:00, 15:00 CDMX
    - cron: '0 15,17,19,21 * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Forzar publicación fuera de ventana (1 = sí, solo pruebas)'
        default: '0'

permissions:
  contents: write

jobs:
  publicar-short:
    runs-on: ubuntu-latest
    env:
      FORZAR_PUBLICACION: ${{ github.event.inputs.forzar || '0' }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot de herbolaria
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
        run: python bot_youtube_shorts.py

      - name: Commit y push del estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar estado herbolaria [skip ci]"
          file_pattern: "estado_herbolaria.json ingredientes_usados.json titulos_herbolaria_publicados.json"
